[project]
name = "trade"
version = "0.0.1"
description = "Sistema di trading multi-agente con risk manager non aggirabile (in sviluppo)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
